<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Shop – Du är i kö</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(160deg, #ffffff 0%, #fff3ec 100%);
  }
  .queue-box {
    text-align: center;
    max-width: 360px;
    width: 100%;
    padding: 20px;
  }
  .queue-logo {
    font-weight: 800;
    font-size: 1.6rem;
    margin-bottom: 24px;
    color: #1c1c1c;
  }
  .queue-spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #ececec;
    border-top-color: #ff3b3b;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: queueSpin 0.8s linear infinite;
  }
  @keyframes queueSpin {
    to { transform: rotate(360deg); }
  }
  .queue-box h2 {
    margin: 0 0 8px;
    font-size: 1.2rem;
    color: #e0281f;
  }
  .queue-box p {
    margin: 0 0 16px;
    font-size: 0.85rem;
    color: #767676;
  }
  .queue-bar-track {
    width: 100%;
    height: 10px;
    background: #ececec;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .queue-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff3b3b, #ff9a1f);
    border-radius: 6px;
  }
  .queue-position {
    font-size: 0.9rem;
    margin: 0 0 6px;
    color: #767676;
  }
  .queue-position strong {
    color: #1c1c1c;
  }
  .queue-eta {
    font-weight: 600;
    color: #1c1c1c;
    margin: 0;
  }
</style>
</head>
<body>

<div class="queue-box">
  <div class="queue-logo">⭐ STAR SHOP</div>
  <div class="queue-spinner"></div>
  <h2>Väldigt högt tryck just nu!</h2>
  <p>Extremt många handlar på Star Shop just nu – du släpps in om en liten stund.</p>
  <div class="queue-bar-track">
    <div class="queue-bar-fill" id="queue-bar-fill"></div>
  </div>
  <p class="queue-position">Din plats i kön: <strong id="queue-position">0</strong></p>
  <p class="queue-eta">Beräknad väntetid: <span id="queue-eta">0 sekunder</span></p>
</div>

<script src="js/queue.js"></script>
</body>
</html>
